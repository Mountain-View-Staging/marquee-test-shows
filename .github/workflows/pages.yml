name: Pages

# Serves shows/ at https://mountain-view-staging.github.io/marquee-test-shows/ — a static
# cloud base: <base>/<CODE>/<file>. Deploys only what passed the leak scan and the locks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Leak scan and locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/leak-scan.py
      - run: scripts/verify.sh

  deploy:
    name: Deploy shows/
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shows
      - id: deployment
        uses: actions/deploy-pages@v4
